# =============================================================================
# Collision baseline plus outcome-conditioned continuous-recovery closure.
#
# Starts from HOPEPingPongOneBounceCollisionAlign instead of the additive recovery-cycle branch.
# The main change is that strong recovery rewards are multiplicative:
#
#   useful hit outcome * reusable next-swing posture
#
# This avoids rewarding a conservative standing policy that does not hit the ball, and avoids rewarding
# a wild hit that leaves the robot unusable for the next ball.
# =============================================================================

defaults:
  - HOPEPingPongOneBounceCollisionAlign
  - _self_

name: HOPEPingPongOneBounceOutcomeRecoveryLoop

motion:
  wrap_teleport: false

overrides:
  # Keep the continuous-rally lifecycle from the recovery-cycle experiment, but restart from the
  # collision model checkpoint so we do not inherit the additive-recovery plateau.
  commands.motion.hold_steps_range: [35, 60]
  commands.motion.stand_start_prob: 0.15
  commands.motion.stand_start_min_hold: 45
  commands.racket_target.racket_pos_curriculum_start_scale: [1.0, 1.0, 1.0]
  commands.racket_target.racket_pos_curriculum_steps: 0

  # Recovery diagnostics mirror the reward components and appear in Metrics/racket_target/*.
  commands.racket_target.recovery_diag_height_std: 0.095
  commands.racket_target.recovery_diag_upright_std: 0.26
  commands.racket_target.recovery_diag_lin_vel_std: 0.24
  commands.racket_target.recovery_diag_ang_vel_std: 0.70
  commands.racket_target.recovery_diag_station_std: 0.21
  commands.racket_target.recovery_diag_racket_vel_std: 0.68
  commands.racket_target.recovery_diag_arm_pos_std: 0.34
  commands.racket_target.recovery_diag_arm_ori_std: 0.78
  commands.racket_target.recovery_diag_early_prestrike_steps: 18

  # Do not fully release the wrist through impact.  Let it correct enough to hit the ball, then force
  # the right arm/racket back toward the motion-prior ready pose after useful outcomes.
  rewards.racket_wrist_motion_pos.weight: 0.30
  rewards.racket_wrist_motion_pos.params:
    motion_command_name: motion
    racket_command_name: racket_target
    std: 0.62
    body_names:
      - right_wrist_yaw_Link
    release_window_s: 0.18
    release_scale: 0.45
  rewards.racket_wrist_motion_ori.weight: 0.20
  rewards.racket_wrist_motion_ori.params:
    motion_command_name: motion
    racket_command_name: racket_target
    std: 0.95
    body_names:
      - right_wrist_yaw_Link
    release_window_s: 0.18
    release_scale: 0.45

  # Keep unconditioned recovery as a low-weight posture floor only.  The strong recovery objective is
  # below, conditioned on contact/net/return outcomes.
  rewards.follow_through_recovery.weight: 0.45
  rewards.follow_through_recovery.params:
    command_name: racket_target
    std: 0.50
    station_std: 0.28
  rewards.recovery_health.weight: 0.45
  rewards.recovery_health.params:
    command_name: racket_target
    height_std: 0.11
    upright_std: 0.30
    lin_vel_std: 0.30
    ang_vel_std: 0.85
    station_std: 0.25
  rewards.next_ball_readiness.weight: 0.25
  rewards.next_ball_readiness.params:
    command_name: racket_target
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    early_prestrike_window_steps: 18
  rewards.next_swing_ready_bonus.weight: 0.15
  rewards.next_swing_ready_bonus.params:
    command_name: racket_target
    window_steps: 18
    height_std: 0.09
    upright_std: 0.24
    lin_vel_std: 0.22
    ang_vel_std: 0.64
    station_std: 0.19
    racket_vel_std: 0.62
    arm_pos_std: 0.32
    arm_ori_std: 0.72
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link

  # Immediate post-swing recovery.  These are multiplicative: no useful outcome, no strong recovery
  # reward.  The return-conditioned term is strongest because it is the closest proxy for a usable rally.
  rewards.post_contact_recovery_ready.weight: 1.10
  rewards.post_contact_recovery_ready.params:
    command_name: racket_target
    outcome: contact
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 3000
    start_scale: 0.35
  rewards.post_net_recovery_ready.weight: 1.60
  rewards.post_net_recovery_ready.params:
    command_name: racket_target
    outcome: net_cross
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 5000
    start_scale: 0.25
  rewards.post_return_recovery_ready.weight: 2.20
  rewards.post_return_recovery_ready.params:
    command_name: racket_target
    outcome: opponent_bounce
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 1000
    warmup_steps: 8000
    start_scale: 0.20

  # Right arm/racket reset after useful hits.  This counters the wrist-only solution without constraining
  # the exact impact frame too tightly.
  rewards.post_contact_arm_racket_ready.weight: 0.90
  rewards.post_contact_arm_racket_ready.params:
    command_name: racket_target
    outcome: contact
    arm_pos_std: 0.30
    arm_ori_std: 0.70
    racket_vel_std: 0.55
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    include_hold: true
    early_prestrike_window_steps: 0
    start_step: 0
    warmup_steps: 3000
    start_scale: 0.35
  rewards.post_net_arm_racket_ready.weight: 1.25
  rewards.post_net_arm_racket_ready.params:
    command_name: racket_target
    outcome: net_cross
    arm_pos_std: 0.30
    arm_ori_std: 0.70
    racket_vel_std: 0.55
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    include_hold: true
    early_prestrike_window_steps: 0
    start_step: 0
    warmup_steps: 5000
    start_scale: 0.25
  rewards.post_return_arm_racket_ready.weight: 1.60
  rewards.post_return_arm_racket_ready.params:
    command_name: racket_target
    outcome: opponent_bounce
    arm_pos_std: 0.30
    arm_ori_std: 0.70
    racket_vel_std: 0.55
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    include_hold: true
    early_prestrike_window_steps: 0
    start_step: 1000
    warmup_steps: 8000
    start_scale: 0.20

  # Next-swing closed-loop readiness.  Contact gives an early dense path; net and opponent-bounce carry
  # the main objective once the policy can keep returning the ball.
  rewards.cycle_contact_ready.weight: 1.20
  rewards.cycle_contact_ready.params:
    command_name: racket_target
    outcome: contact
    window_steps: 18
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 3000
    start_scale: 0.35
  rewards.cycle_net_ready.weight: 2.20
  rewards.cycle_net_ready.params:
    command_name: racket_target
    outcome: net_cross
    window_steps: 18
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 6000
    start_scale: 0.30
  rewards.cycle_return_ready.weight: 4.20
  rewards.cycle_return_ready.params:
    command_name: racket_target
    outcome: opponent_bounce
    window_steps: 18
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 2000
    warmup_steps: 9000
    start_scale: 0.25

  # Keep strike exploration open.  Recovery/hold damping stays higher but not as high as the additive
  # branch that started trading away racket velocity.
  rewards.action_rate.weight: -0.004
  rewards.phase_action_rate.weight: -0.34
  rewards.phase_action_rate.params:
    command_name: racket_target
    pre_strike_scale: 0.020
    strike_scale: 0.004
    recovery_scale: 0.062
    hold_scale: 0.092
  rewards.termination_penalty.weight: -12.0

# F2 differs from F1 only in hit-result settlement. Dense kinematic strike
# objectives remain available, while contact/net/bounce are softly multiplied
# by same-frame body health and closed-cycle events require a healthy impact.

defaults:
  - HOPEPingPongM19495ForehandActiveReadyF1
  - _self_

name: HOPEPingPongM19495ForehandActiveReadySafeHitF2

overrides:
  commands.racket_target.cycle_v2_require_healthy_impact: true

  rewards.soft_ball_contact.weight: 0.0
  rewards.ball_contact.weight: 0.0
  rewards.net_cross.weight: 0.0
  rewards.opponent_bounce.weight: 0.0

  rewards.health_gated_soft_ball_contact.weight: 7.0
  rewards.health_gated_soft_ball_contact.params:
    command_name: racket_target
    minimum_health_multiplier: 0.55
    final_minimum_health_multiplier: 0.35
    pos_std: 0.18
    approach_speed: 0.10
    approach_std: 0.75
    normal_speed: 0.0
    normal_std: 0.75
    window_s: 0.18
    swing_side: 0.0
    start_step: 0
    warmup_steps: 1200
    start_scale: 0.65
  rewards.health_gated_ball_contact.weight: 3.0
  rewards.health_gated_ball_contact.params:
    command_name: racket_target
    minimum_health_multiplier: 0.55
    final_minimum_health_multiplier: 0.35
    start_step: 0
    warmup_steps: 1200
    start_scale: 0.65
  rewards.health_gated_net_cross.weight: 3.8
  rewards.health_gated_net_cross.params:
    command_name: racket_target
    minimum_health_multiplier: 0.55
    final_minimum_health_multiplier: 0.35
    start_step: 0
    warmup_steps: 2000
    start_scale: 0.40
  rewards.health_gated_opponent_bounce.weight: 4.2
  rewards.health_gated_opponent_bounce.params:
    command_name: racket_target
    minimum_health_multiplier: 0.55
    final_minimum_health_multiplier: 0.35
    start_step: 1000
    warmup_steps: 3000
    start_scale: 0.20

  rewards.cycle_v2_ready_success_bonus.weight: 5.0
  rewards.cycle_v2_ready_fail.weight: -2.4

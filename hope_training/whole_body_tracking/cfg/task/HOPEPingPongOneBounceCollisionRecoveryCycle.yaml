# =============================================================================
# Collision mainline plus continuous recovery closure.
#
# This keeps the collision-alignment hit objective that transferred best to MuJoCo, then folds in the
# useful recovery lessons at moderate strength:
#   - intended as a continuation/fine-tune from a mature collision policy, so target-position
#     curriculum stays at full scale;
#   - longer ready/hold windows;
#   - denser post-contact recovery credit;
#   - next-swing readiness and cycle-return readiness;
#   - stronger damping only after contact / during hold, while strike remains light.
# =============================================================================

defaults:
  - HOPEPingPongOneBounceCollisionAlign
  - _self_

name: HOPEPingPongOneBounceCollisionRecoveryCycle

motion:
  wrap_teleport: false

overrides:
  commands.motion.hold_steps_range: [35, 60]
  commands.motion.stand_start_prob: 0.15
  commands.motion.stand_start_min_hold: 45
  commands.racket_target.racket_pos_curriculum_start_scale: [1.0, 1.0, 1.0]
  commands.racket_target.racket_pos_curriculum_steps: 0

  # Keep collision hit quality as the main objective. These values are repeated for clarity and to
  # protect this branch from inheriting the weaker recovery-only impact target.
  commands.racket_target.impact_inverse_racket_speed_scale: 1.18
  commands.racket_target.impact_inverse_racket_speed_bias: 0.10
  commands.racket_target.impact_inverse_max_racket_speed: 3.35
  commands.racket_target.target_outgoing_vel_scale: 1.04
  commands.racket_target.target_outgoing_vel_z_bias: 0.26
  commands.racket_target.net_margin: 0.06

  rewards.racket_position.weight: 4.5
  rewards.racket_velocity.weight: 2.4
  rewards.racket_velocity_projection.weight: 2.2
  rewards.impact_forward_lift.weight: 2.5
  rewards.impact_outgoing_velocity.weight: 4.6
  rewards.blade_direction.weight: 2.4
  rewards.net_cross.weight: 3.8
  rewards.opponent_bounce.weight: 4.2

  # Moderate recovery pressure: stronger than collision, weaker than the recovery-only branch that
  # suppressed racket velocity and failed MuJoCo single-hit transfer.
  rewards.follow_through_recovery.weight: 1.15
  rewards.follow_through_recovery.params:
    command_name: racket_target
    std: 0.46
    station_std: 0.25
  rewards.recovery_health.weight: 1.35
  rewards.recovery_health.params:
    command_name: racket_target
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
  rewards.next_ball_readiness.weight: 1.55
  rewards.next_ball_readiness.params:
    command_name: racket_target
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    early_prestrike_window_steps: 18
  rewards.next_swing_ready_bonus.weight: 1.65
  rewards.next_swing_ready_bonus.params:
    command_name: racket_target
    window_steps: 18
    height_std: 0.09
    upright_std: 0.24
    lin_vel_std: 0.22
    ang_vel_std: 0.64
    station_std: 0.19
    racket_vel_std: 0.62
    arm_pos_std: 0.32
    arm_ori_std: 0.72
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link

  # Dense immediate closure: after a real contact has happened, follow-through frames should recover
  # instead of carrying the swing into a bad next state.
  rewards.post_contact_recovery_ready.weight: 1.25
  rewards.post_contact_recovery_ready.params:
    command_name: racket_target
    outcome: contact
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 3000
    start_scale: 0.35

  # Keep the previous sparse closed-loop signals, but do not make them dominate the hit objective.
  rewards.cycle_net_ready.weight: 1.7
  rewards.cycle_net_ready.params:
    command_name: racket_target
    outcome: net_cross
    window_steps: 18
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 5000
    start_scale: 0.35
  rewards.cycle_return_ready.weight: 3.2
  rewards.cycle_return_ready.params:
    command_name: racket_target
    outcome: opponent_bounce
    window_steps: 18
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 2000
    warmup_steps: 9000
    start_scale: 0.25

  rewards.action_rate.weight: -0.004
  rewards.phase_action_rate.weight: -0.40
  rewards.phase_action_rate.params:
    command_name: racket_target
    pre_strike_scale: 0.020
    strike_scale: 0.004
    recovery_scale: 0.075
    hold_scale: 0.115
  rewards.termination_penalty.weight: -12.0

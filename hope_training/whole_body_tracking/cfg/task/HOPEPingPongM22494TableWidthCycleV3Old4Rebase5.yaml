# 70% old4 / 30% deploy-ready rebase5 motion-prior mixture.

defaults:
  - HOPEPingPongM22494TableWidthCycleV3Old4
  - _self_

name: HOPEPingPongM22494TableWidthCycleV3Old4Rebase5

motion_manifest: hope_training/motions/old4_plus_deploy_ready_rebase5_20260728/manifest.tsv

overrides:

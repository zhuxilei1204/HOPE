name: ppo_closed_loop_v2_durable

runner:
  num_steps_per_env: 64
  max_iterations: 6000
  save_interval: 25
  empirical_normalization: false

policy:
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  init_noise_std: 0.02
  noise_std_type: log

algorithm:
  learning_rate: 0.00005
  schedule: adaptive
  desired_kl: 0.003
  entropy_coef: 0.0005
  num_learning_epochs: 4
  num_mini_batches: 4
  gamma: 0.995
  lam: 0.97
  clip_param: 0.10
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 0.7

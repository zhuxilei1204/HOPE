# =============================================================================
# Mild lower-body stability branch on top of the four user-recorded motions.
#
# This keeps all hit/recovery weights from UserFourMotion intact and adds only two low-weight
# recovery-phase terms. It is intended as a conservative experiment after the stronger lower-stability
# branch destabilized the loaded four-motion policy early in training.
# =============================================================================

defaults:
  - HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotion
  - _self_

name: HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionLowerStableMild

overrides:
  rewards.post_strike_base_ang_vel.weight: 0.35
  rewards.post_strike_base_ang_vel.params:
    command_name: racket_target
    std: 2.0
    include_hold: true
    early_prestrike_window_steps: 12
    start_step: 0
    warmup_steps: 10000
    start_scale: 0.10

  rewards.post_strike_lower_body_action_rate.weight: -0.018
  rewards.post_strike_lower_body_action_rate.params:
    command_name: racket_target
    joint_names:
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
    include_hold: true
    early_prestrike_window_steps: 12
    start_step: 0
    warmup_steps: 10000
    start_scale: 0.10

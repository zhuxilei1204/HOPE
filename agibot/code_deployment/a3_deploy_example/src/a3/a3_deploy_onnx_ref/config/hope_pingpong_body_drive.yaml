#
# Runtime config for hope_pingpong_body_drive:
#   observation[111] -> raw_action[31]
# over the same /body_drive/* joint state/command topics used by hal_ethercat
# and A3_MuJoCo_Sim.

contract: hope_pingpong
control_hz: 50.0
duration_s: 5.0
observation_normalization: none
passive_neck: true

startup:
  # MuJoCo/real bring-up guard: hold a named standing q with PD before the
  # first ONNX policy tick. The policy command feed and lifecycle start after
  # this window.
  prepare_s: 2.0
  # MuJoCo a3_pingpong.xml keyframe "stand", qpos[7:38], in HOPE/A3 31-DOF
  # body-drive order.
  prepare_q:
    waist_yaw_joint: -1.51611e-07
    waist_roll_joint: 0.000163394
    waist_pitch_joint: 0.0136787
    head_yaw_joint: -0.169416
    head_pitch_joint: 0.0
    left_shoulder_pitch_joint: 0.295233
    left_shoulder_roll_joint: 0.112098
    left_shoulder_yaw_joint: -0.00281121
    left_elbow_joint: 0.807255
    left_wrist_roll_joint: 0.000113008
    left_wrist_pitch_joint: 0.00777573
    left_wrist_yaw_joint: -0.000782062
    right_shoulder_pitch_joint: 0.295264
    right_shoulder_roll_joint: -0.112059
    right_shoulder_yaw_joint: 0.00283697
    right_elbow_joint: 0.807309
    right_wrist_roll_joint: -0.000126059
    right_wrist_pitch_joint: 0.00798594
    right_wrist_yaw_joint: 0.000788832
    left_hip_pitch_joint: -0.131545
    left_hip_roll_joint: 0.00801605
    left_hip_yaw_joint: -0.035203
    left_knee_joint: 0.251534
    left_ankle_pitch_joint: -0.129267
    left_ankle_roll_joint: -0.00961262
    right_hip_pitch_joint: -0.131429
    right_hip_roll_joint: -0.00755653
    right_hip_yaw_joint: 0.0351273
    right_knee_joint: 0.251558
    right_ankle_pitch_joint: -0.129385
    right_ankle_roll_joint: 0.0101591

policy:
  model_path: ../../../../../../../analysis/parallel_collision_recovery_20260724/eval_collision_model20994/exported_model20994/hope_pingpong.onnx
  backend: ort_cpu
  input_tensor_name: observation
  output_tensor_name: raw_action
  intra_op_num_threads: 1
  inter_op_num_threads: 1
  fp16: false
  rknn_core_mask: auto

action_adapter:
  config_path: ../../../../../../../a3_deploy/a3_deploy_example/config/action_adapter.yaml

# Until the OptiTrack/planner source is connected in this C++ runner, base pose
# is supplied statically. MuJoCo still closes the body-drive joint/IMU/command
# loop; replacing this with /sim/a3/pelvis_pose or /P1/pose is the next seam.
base_pose:
  position_w: [0.0, 0.0, 0.0]
fixed_station_from_start_base: true
fixed_station_xy: [0.0, 0.0]

example_command_feed:
  period_s: 4.0
  lead_time_s: 1.2
  forehand_pos: [0.55, -0.35, 0.85]
  backhand_pos: [0.55, 0.25, 1.00]
  forehand_vel: [1.5, 1.3, 0.6]
  backhand_vel: [2.0, -0.7, 0.4]

simulation:
  pd_gains:
    groups:
      waist: {kp: 200.0, kd: 5.0}
      neck:  {kp: 20.0,  kd: 1.0}
      arm:   {kp: 40.0,  kd: 2.0}
      leg:   {kp: 200.0, kd: 5.0}
    joints:
      waist_yaw_joint: {kp: 85.0, kd: 3.0}
      waist_roll_joint: {kp: 50.0, kd: 2.0}
      waist_pitch_joint: {kp: 50.0, kd: 2.0}
      head_yaw_joint: {kp: 40.0, kd: 2.0}
      head_pitch_joint: {kp: 40.0, kd: 2.0}
      left_shoulder_pitch_joint: {kp: 40.0, kd: 3.0}
      left_shoulder_roll_joint: {kp: 40.0, kd: 3.0}
      left_shoulder_yaw_joint: {kp: 30.0, kd: 2.0}
      left_elbow_joint: {kp: 30.0, kd: 2.0}
      left_wrist_roll_joint: {kp: 30.0, kd: 2.0}
      left_wrist_pitch_joint: {kp: 20.0, kd: 2.0}
      left_wrist_yaw_joint: {kp: 20.0, kd: 2.0}
      right_shoulder_pitch_joint: {kp: 40.0, kd: 3.0}
      right_shoulder_roll_joint: {kp: 40.0, kd: 3.0}
      right_shoulder_yaw_joint: {kp: 30.0, kd: 2.0}
      right_elbow_joint: {kp: 30.0, kd: 2.0}
      right_wrist_roll_joint: {kp: 30.0, kd: 2.0}
      right_wrist_pitch_joint: {kp: 20.0, kd: 2.0}
      right_wrist_yaw_joint: {kp: 20.0, kd: 2.0}
      left_hip_pitch_joint: {kp: 80.0, kd: 3.0}
      left_hip_roll_joint: {kp: 120.0, kd: 4.0}
      left_hip_yaw_joint: {kp: 80.0, kd: 3.0}
      left_knee_joint: {kp: 250.0, kd: 8.0}
      left_ankle_pitch_joint: {kp: 50.0, kd: 2.0}
      left_ankle_roll_joint: {kp: 50.0, kd: 2.0}
      right_hip_pitch_joint: {kp: 80.0, kd: 3.0}
      right_hip_roll_joint: {kp: 120.0, kd: 4.0}
      right_hip_yaw_joint: {kp: 80.0, kd: 3.0}
      right_knee_joint: {kp: 250.0, kd: 8.0}
      right_ankle_pitch_joint: {kp: 50.0, kd: 2.0}
      right_ankle_roll_joint: {kp: 50.0, kd: 2.0}

lifecycle:
  follow_through_s: 0.6
  recovery_s: 0.8
  ready_time_to_strike: 1.0
  ready_reach_x: 0.40
  ready_reach_y: 0.20
  ready_reach_z: -0.05

policy_driver:
  watchdog:
    max_frame_age_ms: 50.0
    max_unaligned_frames: 10
  rt:
    sched_fifo_priority: 0
    cpu_affinity: -1

backend:
  aimrt_cfg_path: a3_aimrt_config.iceoryx.yaml
  publish_enabled: true
  sync_mode: min_skew_pair
  sync_hz: 100.0
  sync_release_margin_ms: 0.25
  max_group_internal_skew_ms: 0.05
  max_group_pair_skew_ms: 1.0

logging:
  status_every_ticks: 100

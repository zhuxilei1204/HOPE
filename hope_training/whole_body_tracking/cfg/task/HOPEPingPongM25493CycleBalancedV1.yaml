# =============================================================================
# M25493 cycle-balanced fine-tune.
#
# Starts from the fixed/no-reset single-hit-capable baseline and tests whether
# hit rewards should be paid mainly when contact/return happens with a balanced
# trunk/base and leads into the next-swing ready state.
# =============================================================================

defaults:
  - HOPEPingPongM22494CycleStateV2FixedNoResetBHContactNetMarginV1
  - _self_

name: HOPEPingPongM25493CycleBalancedV1

overrides:
  # Do not let one side or a single-shot hit metric alone unlock full difficulty.
  commands.racket_target.ability_curriculum_require_side_contact: true
  commands.racket_target.ability_curriculum_require_side_net: true
  commands.racket_target.ability_curriculum_require_side_success: true
  commands.racket_target.ability_curriculum_forehand_contact_threshold: 0.56
  commands.racket_target.ability_curriculum_backhand_contact_threshold: 0.46
  commands.racket_target.ability_curriculum_forehand_net_threshold: 0.38
  commands.racket_target.ability_curriculum_backhand_net_threshold: 0.30
  commands.racket_target.ability_curriculum_forehand_success_threshold: 0.26
  commands.racket_target.ability_curriculum_backhand_success_threshold: 0.18
  commands.racket_target.ability_curriculum_cycle_success_threshold: 0.46
  commands.racket_target.ability_curriculum_cycle_attempt_threshold: 0.18
  commands.racket_target.ability_curriculum_advance_rate: 0.004
  commands.racket_target.ability_curriculum_regress_rate: 0.016

  # Keep dense single-hit shaping, but make it secondary.  The higher-value path
  # is balanced hit + recoverable cycle, not contact at any body cost.
  rewards.soft_ball_contact.weight: 3.0
  rewards.backhand_soft_ball_contact.weight: 1.2
  rewards.ball_contact.weight: 0.8
  rewards.net_cross.weight: 1.2
  rewards.opponent_bounce.weight: 1.6

  # Preserve the E2 physically meaningful outgoing-ball shaping.
  rewards.contact_net_margin.weight: 2.3
  rewards.impact_forward_lift.weight: 2.7
  rewards.racket_velocity_projection.weight: 2.0
  rewards.impact_outgoing_velocity.weight: 4.2
  rewards.blade_direction.weight: 2.2

  # Main hit objective: reward useful contact/return only when the trunk/base
  # stays in a recoverable state.  These terms do not directly penalize arm range.
  rewards.balanced_soft_ball_contact.weight: 3.8
  rewards.balanced_soft_ball_contact.params:
    command_name: racket_target
    pos_std: 0.19
    approach_speed: 0.06
    approach_std: 0.82
    normal_speed: -0.08
    normal_std: 0.88
    window_s: 0.22
    pre_window_s: 0.34
    post_window_s: 0.18
    pitch_std: 0.20
    upright_std: 0.32
    ang_vel_std: 1.35
    backward_std: 0.23
    backward_vel_std: 0.62
    start_step: 0
    warmup_steps: 2000
    start_scale: 0.35
  rewards.balanced_ball_contact.weight: 2.2
  rewards.balanced_ball_contact.params:
    command_name: racket_target
    pre_window_s: 0.34
    post_window_s: 0.18
    pitch_std: 0.20
    upright_std: 0.32
    ang_vel_std: 1.35
    backward_std: 0.23
    backward_vel_std: 0.62
    start_step: 0
    warmup_steps: 2000
    start_scale: 0.35
  rewards.balanced_net_cross.weight: 3.4
  rewards.balanced_net_cross.params:
    command_name: racket_target
    pre_window_s: 0.34
    post_window_s: 0.18
    pitch_std: 0.20
    upright_std: 0.32
    ang_vel_std: 1.35
    backward_std: 0.23
    backward_vel_std: 0.62
    start_step: 0
    warmup_steps: 2500
    start_scale: 0.30
  rewards.balanced_opponent_bounce.weight: 4.8
  rewards.balanced_opponent_bounce.params:
    command_name: racket_target
    pre_window_s: 0.34
    post_window_s: 0.18
    pitch_std: 0.20
    upright_std: 0.32
    ang_vel_std: 1.35
    backward_std: 0.23
    backward_vel_std: 0.62
    start_step: 0
    warmup_steps: 3000
    start_scale: 0.25

  # Continuous-cycle objective: single-shot hit ability is preserved, but the
  # large reward comes from being ready for the next ball after a useful return.
  rewards.cycle_contact_ready.weight: 0.8
  rewards.cycle_net_ready.weight: 2.0
  rewards.cycle_return_ready.weight: 4.0
  rewards.cycle_success_bonus.weight: 3.0
  rewards.cycle_success_bonus.params:
    command_name: racket_target
    outcome: opponent_bounce
    window_steps: 20
    ready_threshold: 0.70
    ready_temperature: 0.045
    height_std: 0.095
    upright_std: 0.26
    lin_vel_std: 0.24
    ang_vel_std: 0.70
    station_std: 0.21
    racket_vel_std: 0.68
    arm_pos_std: 0.34
    arm_ori_std: 0.78
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 3000
    start_scale: 0.25
  rewards.cycle_v2_ready_success_bonus.weight: 4.8
  rewards.cycle_v2_ready_fail.weight: -10.0

  # Outcome-conditioned recovery.  Generic no-ball/hold stability remains, but
  # post-hit recovery is paid most strongly when the return was actually useful.
  rewards.post_contact_recovery_ready.weight: 1.4
  rewards.post_net_recovery_ready.weight: 1.2
  rewards.post_return_recovery_ready.weight: 2.2
  rewards.post_contact_arm_racket_ready.weight: 0.30
  rewards.post_net_arm_racket_ready.weight: 0.45
  rewards.post_return_arm_racket_ready.weight: 0.75

  # Mild body support during strike.  These keep the trunk/base from being used
  # as a throwaway counterweight while still allowing leg compensation.
  rewards.strike_balance.weight: 0.38
  rewards.strike_balance.params:
    command_name: racket_target
    pre_window_s: 0.34
    post_window_s: 0.18
    pitch_std: 0.20
    upright_std: 0.32
    ang_vel_std: 1.35
    backward_std: 0.23
    backward_vel_std: 0.62
    start_step: 0
    warmup_steps: 1500
    start_scale: 0.30
  rewards.lower_body_support.weight: 0.30
  rewards.lower_body_support.params:
    command_name: racket_target
    pre_window_s: 0.36
    post_window_s: 0.22
    station_std: 0.30
    backward_std: 0.24
    backward_vel_std: 0.65
    min_feet_contact: 0.45
    start_step: 0
    warmup_steps: 1500
    start_scale: 0.25

# =============================================================================
# B17996 explicit recovery V1 + planner-plane aware strike target sampling.
#
# The previous task sampled the hidden true strike x from each motion clip's metadata box.  MuJoCo
# eval with the real planner is sensitive to x_hit, and model_22494 currently works best around
# x_hit=0.20.  This fine-tune keeps the same 114-D actor contract, four-motion prior, collision
# objective, and recovery rewards, but gradually moves the true strike x toward:
#
#   env_x = table_near_x + x_hit = table_near_x + 0.20
#
# y/z remain motion/metadata sampled, and planner perturbation still affects only actor-visible
# commands.  The warmup blend is deliberate because the translation clips' natural strike x does not
# exactly match x_hit=0.20.
# =============================================================================

defaults:
  - HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionNormal114B17996ExplicitRecoveryV1
  - _self_

name: HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionNormal114B17996ExplicitRecoveryV1PlannerPlaneX020

overrides:
  commands.racket_target.planner_hit_plane_mode: fixed_x_hit
  commands.racket_target.planner_hit_plane_x: 0.20
  commands.racket_target.planner_hit_plane_x_jitter_range: [-0.03, 0.03]
  commands.racket_target.planner_hit_plane_blend_start: 0.50
  commands.racket_target.planner_hit_plane_blend: 1.00
  commands.racket_target.planner_hit_plane_blend_warmup_steps: 8000

  # Keep the four-motion dynamic-station behavior, but allow a little extra x compensation for the
  # planner plane, especially for the backhand translation clip whose natural strike x is nearer.
  commands.racket_target.dynamic_station_xy_clip: [[-0.32, 0.32], [-0.44, 0.44]]

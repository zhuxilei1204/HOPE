# V3 branches from the contact-gated V2 model_30100. The holding wrist
# smoothly transfers from motion prior to the actor-visible planner command,
# while V2's hidden-physics contact/outgoing objective remains intact.

defaults:
  - HOPEPingPongA28990ExactImpactOutcome114V2
  - _self_

name: HOPEPingPongV230100PlannerWristCrossfade114V3

overrides:
  rewards.racket_wrist_motion_pos.params:
    motion_command_name: motion
    racket_command_name: racket_target
    std: 0.65
    body_names:
      - right_wrist_yaw_Link
    release_window_s: 0.15
    release_scale: 0.05
    pre_release_start_s: 0.40
    post_full_release_s: 0.08
    post_release_end_s: 0.22
    use_planner_time_to_strike: true
    hold_scale: 0.0

  rewards.racket_wrist_motion_ori.params:
    motion_command_name: motion
    racket_command_name: racket_target
    std: 1.0
    body_names:
      - right_wrist_yaw_Link
    release_window_s: 0.12
    release_scale: 0.10
    pre_release_start_s: 0.35
    post_full_release_s: 0.08
    post_release_end_s: 0.20
    use_planner_time_to_strike: true
    hold_scale: 0.0

  rewards.planner_racket_task_space_crossfade.weight: 3.0
  rewards.planner_racket_task_space_crossfade.params:
    command_name: racket_target
    pre_start_s: 0.40
    pre_full_s: 0.15
    post_full_s: 0.08
    post_end_s: 0.22
    position_std: 0.14
    velocity_std: 0.95
    normal_std_rad: 0.30
    component_floor: 0.04
    start_step: 0
    warmup_steps: 600
    start_scale: 0.50
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.10

  rewards.exact_impact_planner_task_space_alignment.weight: 6.0
  rewards.exact_impact_planner_task_space_alignment.params:
    command_name: racket_target
    position_std: 0.08
    speed_ratio_std: 0.18
    direction_std_rad: 0.25
    normal_std_rad: 0.18
    component_floor: 0.03
    require_contact: true
    start_step: 0
    warmup_steps: 1000
    start_scale: 0.25
    minimum_health_multiplier: 0.15
    final_minimum_health_multiplier: 0.05

# =============================================================================
# Ready-reset scratch continuation with trunk/waist high-frequency damping.
#
# Goal:
#   Test whether the ready12000 baseline can reduce visible torso/waist shake
#   without suppressing leg compensation or right-arm strike freedom.
#
# Difference from HOPEPingPongScratchRealPlannerContinuousAbility:
#   - keep the 114-D actor, real one-bounce planner command, four-motion set,
#     deploy-ready/no-command semantics, and ability-based curriculum;
#   - keep the existing post-strike angular-velocity and recovery rewards;
#   - limit the inherited post_strike_lower_body_action_rate term to only the
#     three waist joints;
#   - ease global phase action-rate so hip/knee/ankle joints can still make
#     fast balance corrections.
# =============================================================================

defaults:
  - HOPEPingPongScratchRealPlannerContinuousAbility
  - _self_

name: HOPEPingPongScratchRealPlannerContinuousAbilityTrunkWaistStable

overrides:
  rewards.post_strike_lower_body_action_rate.weight: -0.078
  rewards.post_strike_lower_body_action_rate.params:
    command_name: racket_target
    joint_names:
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
    include_hold: true
    early_prestrike_window_steps: 18
    start_step: 0
    warmup_steps: 5000
    start_scale: 0.35

  rewards.phase_action_rate.weight: -0.38
  rewards.phase_action_rate.params:
    command_name: racket_target
    pre_strike_scale: 0.020
    strike_scale: 0.004
    recovery_scale: 0.085
    hold_scale: 0.120

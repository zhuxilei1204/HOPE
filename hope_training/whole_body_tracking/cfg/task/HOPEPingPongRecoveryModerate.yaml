# =============================================================================
# Moderate recovery A/B variant.
#
# This keeps the hit rewards dominant and only nudges the policy toward better
# post-strike health.  It is intended to compare against the baseline continuation;
# the stronger recovery variant was too conservative and suppressed hitting.
# =============================================================================

defaults:
  - HOPEPingPong
  - _self_

name: HOPEPingPongRecoveryModerate

overrides:
  commands.motion.hold_steps_range: [25, 55]
  commands.motion.stand_start_prob: 0.30
  commands.motion.stand_start_min_hold: 35

  commands.racket_target.station_mode: dynamic_from_motion
  commands.racket_target.dynamic_station_xy_clip: [[-0.18, 0.18], [-0.22, 0.22]]
  commands.racket_target.dynamic_station_blend: 1.0
  commands.racket_target.racket_pos_curriculum_start_scale: [0.25, 0.25, 0.50]
  commands.racket_target.racket_pos_curriculum_steps: 24000

  rewards.pre_strike_station.weight: 1.0
  rewards.follow_through_recovery.weight: 1.0
  rewards.follow_through_recovery.params.std: 0.45
  rewards.follow_through_recovery.params.station_std: 0.26
  rewards.recovery_health.weight: 1.35
  rewards.recovery_health.params.height_std: 0.10
  rewards.recovery_health.params.upright_std: 0.30
  rewards.recovery_health.params.lin_vel_std: 0.30
  rewards.recovery_health.params.ang_vel_std: 0.85
  rewards.recovery_health.params.station_std: 0.23
  rewards.termination_penalty.weight: -12.0

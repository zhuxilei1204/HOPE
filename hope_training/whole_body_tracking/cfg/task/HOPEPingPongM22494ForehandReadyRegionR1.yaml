# F2 continuation with a biomechanical forehand READY region and explicit
# post-contact directional settlement. Hitting rewards are unchanged.

defaults:
  - HOPEPingPongM19495ForehandActiveReadySafeHitF2
  - _self_

name: HOPEPingPongM22494ForehandReadyRegionR1

overrides:
  # The left arm stays near the stable F2 state. The right arm uses the settled
  # tail of the validated forehand motion, including a flexed rather than
  # nearly straight elbow. Per-joint deadbands define a region, not one pose.
  commands.racket_target.functional_ready_joint_positions:
    [-0.246565, 0.618356, 0.026664, 0.333463, -0.591667, -0.344093, 0.642940,
     -1.124400, -0.267800, 0.441000, 0.792700, 0.866700, -0.142800, -0.238400]
  commands.racket_target.functional_ready_joint_tolerances:
    [0.35, 0.30, 0.35, 0.35, 0.45, 0.30, 0.40,
     0.20, 0.18, 0.20, 0.18, 0.30, 0.15, 0.20]
  commands.racket_target.functional_ready_joint_std: 0.22

  commands.racket_target.active_ready_required_consecutive_steps: 10
  commands.racket_target.active_ready_score_threshold: 0.62
  commands.racket_target.active_ready_max_height_error: 0.08
  commands.racket_target.active_ready_max_upright_error: 0.18
  commands.racket_target.active_ready_max_base_lin_vel: 0.18
  commands.racket_target.active_ready_max_base_ang_vel: 0.55
  commands.racket_target.active_ready_min_feet_contact: 0.99

  commands.racket_target.post_contact_ready_enabled: true
  commands.racket_target.post_contact_ready_torso_x_min: -0.035
  commands.racket_target.post_contact_ready_torso_x_max: 0.14
  commands.racket_target.post_contact_ready_torso_x_std: 0.06
  commands.racket_target.post_contact_ready_max_torso_ang_vel: 0.60
  commands.racket_target.post_contact_ready_max_height_error: 0.08
  commands.racket_target.post_contact_ready_max_base_lin_vel: 0.18
  commands.racket_target.post_contact_ready_max_base_ang_vel: 0.55
  commands.racket_target.post_contact_ready_max_com_x: 0.11
  commands.racket_target.post_contact_ready_max_com_y: 0.13
  commands.racket_target.post_contact_ready_min_feet_contact: 0.99
  commands.racket_target.post_contact_ready_max_station_error: 0.22
  commands.racket_target.post_contact_ready_max_racket_speed: 0.90
  commands.racket_target.post_contact_ready_min_arm_score: 0.45
  commands.racket_target.post_contact_ready_required_consecutive_steps: 10
  commands.racket_target.post_contact_ready_deadline_steps: 70
  commands.racket_target.post_contact_ready_progress_clip: 0.035

  # Keep the older next-cycle state machine semantically consistent with the
  # new contact-local READY definition.
  commands.racket_target.cycle_v2_required_consecutive_ready_steps: 10
  commands.racket_target.cycle_v2_ready_threshold: 0.62
  commands.racket_target.cycle_v2_max_height_error: 0.08
  commands.racket_target.cycle_v2_max_upright_error: 0.18
  commands.racket_target.cycle_v2_max_base_lin_vel: 0.18
  commands.racket_target.cycle_v2_max_base_ang_vel: 0.55
  commands.racket_target.cycle_v2_min_feet_contact: 0.99
  commands.racket_target.cycle_v2_max_racket_speed: 0.90
  commands.racket_target.cycle_v2_min_arm_score: 0.45

  rewards.no_command_ready_balance.weight: 0.35
  rewards.no_command_ready_balance.params:
    command_name: racket_target
    pitch_std: 0.10
    roll_std: 0.12
    lin_vel_std: 0.16
    ang_vel_std: 0.44
    height_std: 0.085
    station_std: 0.17
    min_feet_contact: 0.99
    start_step: 0
    warmup_steps: 900
    start_scale: 0.30

  rewards.post_contact_directional_recovery.weight: 0.45
  rewards.post_contact_directional_recovery.params:
    command_name: racket_target
    start_step: 0
    warmup_steps: 900
    start_scale: 0.35
  rewards.post_contact_ready_region.weight: 1.10
  rewards.post_contact_ready_region.params:
    command_name: racket_target
    start_step: 0
    warmup_steps: 900
    start_scale: 0.35
  rewards.post_contact_ready_success_bonus.weight: 4.0
  rewards.post_contact_ready_success_bonus.params:
    command_name: racket_target
    start_step: 0
    warmup_steps: 1200
    start_scale: 0.25
  rewards.post_contact_ready_fail.weight: -2.0
  rewards.post_contact_ready_fail.params:
    command_name: racket_target
    start_step: 0
    warmup_steps: 900
    start_scale: 0.30

  rewards.deferred_recovery_outcome_bonus.weight: 0.0


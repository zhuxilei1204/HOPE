# Shared task for the two reproducibility routes:
#   1) Scratch122-Healthy3Stage-v1
#   2) Warm22750-Healthy3Stage-v1
#
# The routes differ only in actor initialization. Curriculum transitions are
# ability-gated; no stage is unlocked from the PPO iteration count.

defaults:
  - HOPEPingPongM22494TableWidthCycleV3Old4
  - _self_

name: HOPEPingPongHealthy3Stage122
actor_obs_contract: hope_pingpong_stability122
motion_manifest: hope_training/motions/user_four_motion_manual_hits_a3fk_yaw_leg_stabilized_20260724/manifest.tsv

actor_obs:
  racket_target_normal_w: true
  stability_feedback: true

overrides:
  episode_length_s: 48.0

  commands.motion.wrap_teleport: false
  commands.motion.hold_steps_range: [90, 140]
  commands.motion.stand_start_prob: 0.20
  commands.motion.stand_start_min_hold: 90
  commands.motion.clip_sampling_weights: [0.25, 0.25, 0.25, 0.25]
  commands.motion.core_clip_count: 4

  # Planner/table geometry stays identical across both routes.
  commands.racket_target.strike_position_mode: table_workspace
  commands.racket_target.planner_hit_plane_mode: fixed_x_hit
  commands.racket_target.planner_hit_plane_x: 0.20
  commands.racket_target.station_mode: dynamic_from_motion
  commands.racket_target.dynamic_station_xy_clip: [[0.0, 0.0], [-0.65, 0.65]]
  commands.racket_target.table_workspace_forehand_core_y_range: [-0.40, -0.25]
  commands.racket_target.table_workspace_backhand_core_y_range: [-0.10, 0.10]
  commands.racket_target.table_workspace_x_jitter_core_range: [-0.01, 0.01]
  commands.racket_target.table_workspace_z_core_above_surface_range: [0.38, 0.52]
  commands.racket_target.table_workspace_fringe_prob: 0.10

  # Stage 1: planted healthy strike.
  # Stage 2: lateral READY hold, braking, then the same core strike.
  # Stage 3: planted rehearsal + combined movement/strike and table expansion.
  commands.racket_target.healthy_three_stage_enabled: true
  commands.racket_target.healthy_stage2_start_level: 0.20
  commands.racket_target.healthy_stage3_start_level: 0.60
  commands.racket_target.healthy_stage1_ready_hold_prob: 0.20
  commands.racket_target.healthy_stage2_ready_hold_prob: 0.50
  commands.racket_target.healthy_stage3_ready_hold_prob: 0.20
  commands.racket_target.healthy_stage3_planted_rehearsal_prob: 0.20
  commands.racket_target.healthy_stage_use_dynamic_station_during_ready: true
  commands.racket_target.healthy_stage_lateral_station_bias: 0.10
  commands.racket_target.healthy_stage2_station_y_clip: 0.10
  commands.racket_target.healthy_stage3_station_target_gain: 0.85
  commands.racket_target.healthy_stage_station_arrival_radius: 0.07
  commands.racket_target.healthy_stage_station_settle_max_lin_vel: 0.18
  commands.racket_target.healthy_stage_station_settle_max_ang_vel: 0.65
  commands.racket_target.healthy_stage_station_settle_min_steps: 12
  commands.racket_target.healthy_stage_side_contact_threshold: 0.38
  commands.racket_target.healthy_stage_normal_threshold: 0.35
  commands.racket_target.healthy_stage_safety_threshold: 0.995
  commands.racket_target.healthy_stage_recovery_threshold: 0.66
  commands.racket_target.healthy_stage_station_arrival_threshold: 0.75
  commands.racket_target.healthy_stage_station_settle_threshold: 0.65
  commands.racket_target.healthy_stage_normal_error_max_deg: 32.0

  # Difficulty grows from measured ability, never from iteration count.
  commands.racket_target.ability_curriculum_enabled: true
  commands.racket_target.ability_curriculum_start_racket_pos_scale: [1.0, 1.0, 1.0]
  commands.racket_target.ability_curriculum_start_ball_scale: 0.50
  commands.racket_target.ability_curriculum_start_planner_perturb_scale: 0.25
  commands.racket_target.ability_curriculum_ema_rate: 0.02
  commands.racket_target.ability_curriculum_advance_rate: 0.004
  commands.racket_target.ability_curriculum_regress_rate: 0.012
  commands.racket_target.ability_curriculum_contact_threshold: 0.44
  commands.racket_target.ability_curriculum_net_threshold: 0.22
  commands.racket_target.ability_curriculum_success_threshold: 0.10
  commands.racket_target.ability_curriculum_recovery_threshold: 0.68
  commands.racket_target.ability_curriculum_recovery_floor: 0.55
  commands.racket_target.ability_curriculum_outcome_regress_ratio: 0.60
  commands.racket_target.ability_curriculum_require_side_contact: true
  commands.racket_target.ability_curriculum_require_side_net: false
  commands.racket_target.ability_curriculum_forehand_contact_threshold: 0.35
  commands.racket_target.ability_curriculum_backhand_contact_threshold: 0.35
  commands.racket_target.ability_curriculum_use_cycle_v2: false
  commands.racket_target.ability_curriculum_use_safety_gates: true
  commands.racket_target.ability_curriculum_attempt_threshold: 0.40
  commands.racket_target.ability_curriculum_safety_threshold: 0.995
  commands.racket_target.ability_curriculum_safety_floor: 0.985
  commands.racket_target.ability_curriculum_station_saturation_threshold: 0.10
  commands.racket_target.ability_curriculum_station_saturation_regress_threshold: 0.18
  commands.racket_target.ability_curriculum_require_healthy_impact: true

  # One-sided health: forward transfer remains legal; backward torso/waist,
  # COM escape, and base retreat do not. No arm joint appears in this gate.
  commands.racket_target.impact_health_include_waist_retreat: true
  commands.racket_target.impact_health_backlean_tolerance: 0.04
  commands.racket_target.impact_health_backlean_std: 0.11
  commands.racket_target.impact_health_max_backlean: 0.16
  commands.racket_target.impact_health_waist_backfold_tolerance: 0.04
  commands.racket_target.impact_health_waist_backfold_std: 0.11
  commands.racket_target.impact_health_max_waist_backfold: 0.18
  commands.racket_target.impact_health_base_retreat_std: 0.08
  commands.racket_target.impact_health_max_base_retreat: 0.10
  commands.racket_target.impact_health_max_com_x: 0.18
  commands.racket_target.impact_health_max_com_y: 0.20
  commands.racket_target.impact_health_max_backward_vel: 0.30

  commands.racket_target.cycle_v2_enabled: true
  commands.racket_target.cycle_v2_outcome_by_ability: true
  commands.racket_target.cycle_v2_required_outcome: contact
  commands.racket_target.cycle_v2_net_outcome_level: 0.60
  commands.racket_target.cycle_v2_bounce_outcome_level: 0.82
  commands.racket_target.cycle_v2_visible_deadline_steps: 70
  commands.racket_target.cycle_v2_total_deadline_steps: 110
  commands.racket_target.cycle_v2_count_no_command_as_visible: true
  commands.racket_target.cycle_v2_fail_on_strike_without_ready: true
  commands.racket_target.cycle_v2_fail_unresolved_on_resample: true
  commands.racket_target.cycle_v2_ready_mode: core_hard_soft
  commands.racket_target.cycle_v2_ready_threshold: 0.68
  commands.racket_target.cycle_v2_require_healthy_impact: true

  # Motion remains a prior. Lower-body imitation is intentionally light so the
  # hips, knees, and ankles can make fast support corrections.
  rewards.motion_global_anchor_pos.weight: 0.15
  rewards.motion_global_anchor_ori.weight: 0.25
  rewards.motion_body_pos.weight: 0.65
  rewards.motion_body_pos.params:
    command_name: motion
    std: 0.32
    body_names: &healthy_upper_motion_bodies
      - pelvis_link
      - torso_Link
      - left_shoulder_roll_Link
      - left_elbow_Link
      - left_wrist_yaw_Link
      - right_shoulder_roll_Link
      - right_elbow_Link
  rewards.motion_body_ori.weight: 0.65
  rewards.motion_body_ori.params:
    command_name: motion
    std: 0.44
    body_names: *healthy_upper_motion_bodies
  rewards.motion_body_lin_vel.weight: 0.30
  rewards.motion_body_lin_vel.params:
    command_name: motion
    std: 1.10
    body_names: *healthy_upper_motion_bodies
  rewards.motion_body_ang_vel.weight: 0.30
  rewards.motion_body_ang_vel.params:
    command_name: motion
    std: 3.30
    body_names: *healthy_upper_motion_bodies
  rewards.imitation.weight: 0.70
  rewards.phase_lower_body_motion_prior.weight: 0.28
  rewards.phase_lower_body_motion_prior.params:
    motion_command_name: motion
    racket_command_name: racket_target
    std_pos: 0.32
    std_ori: 0.52
    body_names:
      - pelvis_link
      - left_hip_roll_Link
      - left_knee_Link
      - left_ankle_roll_Link
      - right_hip_roll_Link
      - right_knee_Link
      - right_ankle_roll_Link
    pre_strike_scale: 0.12
    strike_scale: 0.04
    recovery_scale: 0.48
    hold_scale: 0.38
    core_clip_scale: 1.0
    supplemental_clip_scale: 1.0

  # Every dense strike objective is health-conditioned. Early exploration keeps
  # a 0.25 floor; the floor contracts to 0.05 as measured ability grows.
  rewards.racket_position.weight: 3.6
  rewards.racket_position.params:
    command_name: racket_target
    std: 0.22
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05
  rewards.racket_velocity.weight: 1.8
  rewards.racket_velocity.params:
    command_name: racket_target
    std: 2.2
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05
  rewards.racket_velocity_projection.weight: 1.8
  rewards.racket_velocity_projection.params:
    command_name: racket_target
    min_speed_ratio: 0.76
    speed_std: 0.40
    lateral_std: 0.78
    start_step: 0
    warmup_steps: 0
    start_scale: 1.0
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05
  rewards.impact_forward_lift.weight: 1.6
  rewards.impact_forward_lift.params:
    command_name: racket_target
    min_forward_speed: 1.75
    min_upward_speed: 0.85
    speed_std: 0.50
    start_step: 0
    warmup_steps: 0
    start_scale: 1.0
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05
  rewards.impact_outgoing_velocity.weight: 2.8
  rewards.impact_outgoing_velocity.params:
    command_name: racket_target
    std: 2.5
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05
  rewards.blade_direction.weight: 1.8
  rewards.blade_direction.params:
    command_name: racket_target
    std: 0.62
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05

  rewards.soft_ball_contact.weight: 0.0
  rewards.ball_contact.weight: 0.0
  rewards.net_cross.weight: 0.0
  rewards.opponent_bounce.weight: 0.0
  rewards.health_gated_soft_ball_contact.weight: 5.5
  rewards.health_gated_soft_ball_contact.params:
    command_name: racket_target
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05
    pos_std: 0.18
    approach_speed: 0.08
    approach_std: 0.80
    normal_speed: -0.05
    normal_std: 0.85
    window_s: 0.22
  rewards.health_gated_ball_contact.weight: 2.0
  rewards.health_gated_ball_contact.params:
    command_name: racket_target
    minimum_health_multiplier: 0.25
    final_minimum_health_multiplier: 0.05
  rewards.health_gated_net_cross.weight: 2.2
  rewards.health_gated_net_cross.params:
    command_name: racket_target
    minimum_health_multiplier: 0.20
    final_minimum_health_multiplier: 0.05
  rewards.health_gated_opponent_bounce.weight: 2.8
  rewards.health_gated_opponent_bounce.params:
    command_name: racket_target
    minimum_health_multiplier: 0.20
    final_minimum_health_multiplier: 0.05
  rewards.healthy_trunk_support.weight: 0.70

  rewards.no_command_ready_stability.weight: 1.20
  rewards.recovery_health.weight: 1.10
  rewards.next_ball_readiness.weight: 1.10
  rewards.next_swing_ready_bonus.weight: 1.20
  rewards.prestrike_station_progress.weight: 0.55
  rewards.prestrike_station_progress.params:
    command_name: racket_target
    speed_scale: 0.32
    arrival_radius: 0.07
    stop_window_s: 0.10
    include_no_command_ready: true
    start_step: 0
    warmup_steps: 0
    start_scale: 1.0
  rewards.cycle_v2_ready_success_bonus.weight: 7.0
  rewards.cycle_v2_ready_fail.weight: -7.0
  rewards.cycle_v2_streak_bonus.weight: 2.5

  # Legs are free during movement and impact. Only mild damping remains after
  # the hit/while holding READY; waist smoothing is still modest and phase-local.
  rewards.action_rate.weight: 0.0
  rewards.phase_action_rate.weight: 0.0
  rewards.post_strike_lower_body_action_rate.weight: 0.0
  rewards.phase_action_rate_waist.weight: -0.035
  rewards.phase_action_rate_waist.params:
    command_name: racket_target
    joint_names: [waist_yaw_joint, waist_roll_joint, waist_pitch_joint]
    pre_strike_scale: 0.005
    strike_scale: 0.001
    recovery_scale: 0.045
    hold_scale: 0.055
  rewards.phase_action_rate_upper.weight: -0.012
  rewards.phase_action_rate_upper.params:
    command_name: racket_target
    joint_names:
      - head_yaw_joint
      - head_pitch_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    pre_strike_scale: 0.004
    strike_scale: 0.001
    recovery_scale: 0.025
    hold_scale: 0.035
  rewards.phase_action_rate_legs.weight: -0.006
  rewards.phase_action_rate_legs.params:
    command_name: racket_target
    joint_names:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
    pre_strike_scale: 0.001
    strike_scale: 0.0
    recovery_scale: 0.012
    hold_scale: 0.018

  rewards.torso_com_balance.weight: 0.0
  rewards.torso_com_recovery_balance.weight: 0.0
  rewards.strike_balance.weight: 0.0
  rewards.lower_body_support.weight: 0.0
  rewards.table_no_touch.weight: -0.8
  rewards.termination_penalty.weight: -14.0

  # Misses remain alive for exploration; physical falls and table collision stay hard.
  terminations.cycle_v2_ready_timeout.params:
    command_name: racket_target
    enabled: false
    start_step: 0

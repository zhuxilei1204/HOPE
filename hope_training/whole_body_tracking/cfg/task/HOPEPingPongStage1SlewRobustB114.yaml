  rewards.joint_target_slew.weight: -0.08
  rewards.joint_target_slew.params.waist_scale: 1.0
  rewards.joint_target_slew.params.other_upper_scale: 0.15
  rewards.joint_target_slew.params.right_arm_scale: 0.08
  rewards.joint_target_slew.params.leg_scale: 1.20
  rewards.joint_target_slew.params.pre_strike_scale: 0.35
  rewards.joint_target_slew.params.strike_scale: 0.03
  rewards.joint_target_slew.params.recovery_scale: 1.25
  rewards.joint_target_slew.params.hold_scale: 1.60
  rewards.joint_target_slew.params.velocity_excess_scale: 0.50
  rewards.joint_target_slew.params.acceleration_excess_scale: 1.0
  rewards.joint_target_slew.params.acceleration_weight: 0.80

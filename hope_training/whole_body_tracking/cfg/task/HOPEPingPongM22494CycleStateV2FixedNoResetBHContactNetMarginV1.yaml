# =============================================================================
# M22494 fixed/no-reset + backhand contact focus + contact-conditioned net margin.
#
# This is the second A/B branch.  It inherits the backhand contact fixes and adds
# a dense, contact-conditioned net-clearance objective for the contact-no-net
# MuJoCo failure mode.
# =============================================================================

defaults:
  - HOPEPingPongM22494CycleStateV2FixedNoResetBHContactV1
  - _self_

name: HOPEPingPongM22494CycleStateV2FixedNoResetBHContactNetMarginV1

overrides:
  rewards.contact_net_margin.weight: 2.10
  rewards.contact_net_margin.params:
    command_name: racket_target
    pos_std: 0.17
    approach_speed: 0.06
    approach_std: 0.82
    normal_speed: -0.08
    normal_std: 0.88
    window_s: 0.20
    min_forward_speed: 2.10
    forward_std: 0.38
    min_upward_speed: 1.02
    upward_std: 0.38
    min_clearance: 0.04
    clearance_std: 0.07
    swing_side: 0.0
    start_step: 0
    warmup_steps: 2500
    start_scale: 0.35

  # Slightly nudge the existing dense impact objective, but do not make the
  # strike so aggressive that the A no-fall behavior is lost.
  rewards.impact_forward_lift.weight: 2.80
  rewards.net_cross.weight: 4.05
  rewards.opponent_bounce.weight: 4.30

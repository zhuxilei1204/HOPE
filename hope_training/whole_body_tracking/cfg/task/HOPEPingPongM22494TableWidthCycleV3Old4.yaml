# =============================================================================
# Table-width, ability-gated continuous-cycle task initialized from model_22494.
#
# Physical ball routes are sampled from the regulation 1.525 m table width and
# are independent of per-motion racket boxes. Motion remains a side-compatible
# action prior. A useful hit is closed only after the robot reaches next-ready.
# =============================================================================

defaults:
  - HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionNormal114B17996ExplicitRecoveryV1
  - _self_

name: HOPEPingPongM22494TableWidthCycleV3Old4

motion_manifest: hope_training/motions/user_four_motion_manual_hits_a3fk_yaw_leg_stabilized_20260724/manifest.tsv

overrides:
  episode_length_s: 36.0

  commands.motion.wrap_teleport: false
  commands.motion.hold_steps_range: [80, 130]
  commands.motion.stand_start_prob: 0.20
  commands.motion.stand_start_min_hold: 80
  commands.motion.clip_sampling_weights: [0.25, 0.25, 0.25, 0.25]
  commands.motion.core_clip_count: 4

  # Regulation-table target workspace. In simulator coordinates the table centre
  # is y=0. The 2 cm margin is exactly one ball radius, so every physically valid
  # ball-centre position across the 1.525 m table width remains reachable.
  commands.racket_target.strike_position_mode: table_workspace
  commands.racket_target.planner_hit_plane_mode: fixed_x_hit
  commands.racket_target.planner_hit_plane_x: 0.20
  commands.racket_target.table_workspace_edge_margin: 0.02
  commands.racket_target.table_workspace_side_overlap: 0.12
  commands.racket_target.table_workspace_forehand_core_y_range: [-0.55, -0.20]
  commands.racket_target.table_workspace_backhand_core_y_range: [-0.12, 0.18]
  commands.racket_target.table_workspace_x_jitter_core_range: [-0.015, 0.015]
  commands.racket_target.table_workspace_x_jitter_full_range: [-0.04, 0.04]
  commands.racket_target.table_workspace_z_core_above_surface_range: [0.40, 0.58]
  commands.racket_target.table_workspace_z_full_above_surface_range: [0.34, 0.70]
  commands.racket_target.table_workspace_fringe_prob: 0.12
  commands.racket_target.station_mode: dynamic_from_motion
  commands.racket_target.dynamic_station_xy_clip: [[-0.25, 0.25], [-0.90, 0.90]]

  # Workspace, ball difficulty, and planner noise advance from measured ability.
  commands.racket_target.ability_curriculum_enabled: true
  commands.racket_target.ability_curriculum_start_racket_pos_scale: [1.0, 1.0, 1.0]
  commands.racket_target.ability_curriculum_start_ball_scale: 0.55
  commands.racket_target.ability_curriculum_start_planner_perturb_scale: 0.35
  commands.racket_target.ability_curriculum_ema_rate: 0.02
  commands.racket_target.ability_curriculum_advance_rate: 0.0025
  commands.racket_target.ability_curriculum_regress_rate: 0.012
  commands.racket_target.ability_curriculum_contact_threshold: 0.48
  commands.racket_target.ability_curriculum_net_threshold: 0.28
  commands.racket_target.ability_curriculum_success_threshold: 0.16
  commands.racket_target.ability_curriculum_recovery_threshold: 0.70
  commands.racket_target.ability_curriculum_recovery_floor: 0.58
  commands.racket_target.ability_curriculum_outcome_regress_ratio: 0.75
  commands.racket_target.ability_curriculum_require_side_contact: true
  commands.racket_target.ability_curriculum_require_side_net: true
  commands.racket_target.ability_curriculum_forehand_contact_threshold: 0.38
  commands.racket_target.ability_curriculum_backhand_contact_threshold: 0.38
  commands.racket_target.ability_curriculum_forehand_net_threshold: 0.20
  commands.racket_target.ability_curriculum_backhand_net_threshold: 0.20
  commands.racket_target.ability_curriculum_use_safety_gates: true
  commands.racket_target.ability_curriculum_attempt_threshold: 0.45
  commands.racket_target.ability_curriculum_attempt_min_racket_speed: 0.35
  commands.racket_target.ability_curriculum_safety_threshold: 0.995
  commands.racket_target.ability_curriculum_safety_floor: 0.985
  commands.racket_target.ability_curriculum_station_saturation_threshold: 0.08
  commands.racket_target.ability_curriculum_station_saturation_regress_threshold: 0.15
  commands.racket_target.ability_curriculum_safe_min_base_height: 0.70
  commands.racket_target.ability_curriculum_safe_max_tilt: 0.65

  # Close a cycle on contact at low ability, net clear at medium ability, and
  # opponent bounce at high ability. A miss remains alive; a fall remains hard.
  commands.racket_target.cycle_v2_enabled: true
  commands.racket_target.cycle_v2_outcome_by_ability: true
  commands.racket_target.cycle_v2_required_outcome: contact
  commands.racket_target.cycle_v2_net_outcome_level: 0.35
  commands.racket_target.cycle_v2_bounce_outcome_level: 0.70
  commands.racket_target.cycle_v2_visible_deadline_steps: 60
  commands.racket_target.cycle_v2_total_deadline_steps: 90
  commands.racket_target.cycle_v2_count_no_command_as_visible: true
  commands.racket_target.cycle_v2_fail_on_strike_without_ready: true
  commands.racket_target.cycle_v2_fail_unresolved_on_resample: true
  commands.racket_target.cycle_v2_ready_mode: core_hard_soft
  commands.racket_target.cycle_v2_ready_threshold: 0.68
  commands.racket_target.cycle_v2_max_base_lin_vel: 0.30
  commands.racket_target.cycle_v2_max_base_ang_vel: 1.10
  commands.racket_target.ability_curriculum_use_cycle_v2: true
  commands.racket_target.ability_curriculum_cycle_v2_update_mode: events
  commands.racket_target.ability_curriculum_cycle_success_threshold: 0.40
  commands.racket_target.ability_curriculum_cycle_attempt_threshold: 0.15

  # Motion is strongest in recovery/hold and light during impact. This leaves
  # the lower body free for fast compensation while preserving braking timing.
  rewards.phase_lower_body_motion_prior.weight: 0.55
  rewards.phase_lower_body_motion_prior.params:
    motion_command_name: motion
    racket_command_name: racket_target
    std_pos: 0.30
    std_ori: 0.48
    body_names:
      - pelvis_link
      - left_hip_roll_Link
      - left_knee_Link
      - left_ankle_roll_Link
      - right_hip_roll_Link
      - right_knee_Link
      - right_ankle_roll_Link
    pre_strike_scale: 0.32
    strike_scale: 0.12
    recovery_scale: 1.0
    hold_scale: 1.15
    core_clip_scale: 0.80
    supplemental_clip_scale: 1.15

  # Keep dense hit shaping for exploration, but make closed-cycle success the
  # largest event. Tier multipliers correspond to contact/net/bounce.
  rewards.alive.weight: 0.03
  rewards.soft_ball_contact.weight: 5.0
  rewards.ball_contact.weight: 1.5
  rewards.net_cross.weight: 1.8
  rewards.opponent_bounce.weight: 2.2
  rewards.racket_position.weight: 4.0
  rewards.racket_velocity.weight: 2.2
  rewards.racket_velocity_projection.weight: 2.0
  rewards.impact_forward_lift.weight: 2.2
  rewards.impact_outgoing_velocity.weight: 3.8
  rewards.blade_direction.weight: 2.0
  rewards.cycle_contact_ready.weight: 0.60
  rewards.cycle_net_ready.weight: 1.00
  rewards.cycle_return_ready.weight: 1.40
  rewards.cycle_success_bonus.weight: 0.0
  rewards.cycle_v2_ready_success_bonus.weight: 7.0
  rewards.cycle_v2_ready_success_bonus.params:
    command_name: racket_target
    tier_multipliers: [1.0, 1.2, 1.5]
    start_step: 0
    warmup_steps: 1500
    start_scale: 0.45
  rewards.cycle_v2_streak_bonus.weight: 4.0
  rewards.cycle_v2_streak_bonus.params:
    command_name: racket_target
    min_streak: 2
    min_ability_level: 0.70
    start_step: 0
    warmup_steps: 2500
    start_scale: 0.25
  rewards.cycle_v2_ready_fail.weight: -7.0
  rewards.cycle_v2_ready_fail.params:
    command_name: racket_target
    start_step: 0
    warmup_steps: 1500
    start_scale: 0.35
  rewards.no_command_ready_stability.weight: 0.65
  rewards.table_no_touch.weight: -0.75
  rewards.termination_penalty.weight: -14.0

  # Stable misses continue. Only physical safety failures reset the episode.
  terminations.cycle_v2_ready_timeout.params:
    command_name: racket_target
    enabled: false
    start_step: 0
  terminations.table_touch.params:
    command_name: racket_target
    body_names:
      - torso_Link
      - left_shoulder_roll_Link
      - left_elbow_Link
      - left_wrist_yaw_Link
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    include_racket: true
    x_margin: 0.03
    y_margin: 0.03
    below_surface_margin: 0.06
    above_surface_margin: 0.03
    min_steps: 75
    enabled: true

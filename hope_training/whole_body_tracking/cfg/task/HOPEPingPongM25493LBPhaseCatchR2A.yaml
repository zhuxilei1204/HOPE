# R2A: preserve the useful fast leg compensation from P0R1 during approach and
# strike, then progressively catch the lower body during recovery and hold.
#
# Relative to the exact P0R0 leg action-rate pressure:
#   pre-strike 20%, strike 20%, recovery 40%, hold 50%.
# The full lower-body motion prior remains active.
defaults:
  - HOPEPingPongM25493LBRateReleaseP0R1
  - _self_

name: HOPEPingPongM25493LBPhaseCatchR2A

overrides:
  rewards.phase_action_rate_legs.params:
    command_name: racket_target
    joint_names:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
    pre_strike_scale: 0.002824
    strike_scale: 0.001122
    recovery_scale: 0.024600
    hold_scale: 0.042250


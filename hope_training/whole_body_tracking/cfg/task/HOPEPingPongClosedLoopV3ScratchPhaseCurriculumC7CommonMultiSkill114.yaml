defaults:
  - HOPEPingPongClosedLoopV3ScratchAdaptiveMotionV6CMultiSkill114
  - _self_

name: HOPEPingPongClosedLoopV3ScratchPhaseCurriculumC7CommonMultiSkill114

# C7 keeps one 114-D actor and the audited five-motion prior, but makes the
# deploy lifecycle explicit in command semantics:
#   relocation READY -> strike -> outcome-conditioned recovery READY.
# Route width and incoming speed advance from separate measured abilities.
overrides:
  # Keep all five clips. Lifecycle-conditioned reset fractions expose both
  # pre-strike discovery and recovery without tying either to iteration count.
  commands.motion.motion_start_warmup_prestrike_fraction: 0.60
  commands.motion.motion_start_warmup_recovery_fraction: 0.15
  commands.motion.motion_start_warmup_lifecycle_prestrike_fraction_end: 0.45
  commands.motion.motion_start_warmup_lifecycle_recovery_fraction_end: 0.30

  # Route/relocation curriculum. The target is derived from the sampled table
  # route, not from the motion root. A bounded hold prevents relocation from
  # hiding every strike opportunity when the policy is still random.
  commands.racket_target.healthy_three_stage_enabled: false
  commands.racket_target.deploy_ready_hold_prob: 0.35
  commands.racket_target.station_relocation_enabled: true
  commands.racket_target.station_relocation_apply_to_swing_holds: true
  commands.racket_target.station_relocation_use_dynamic_target: true
  commands.racket_target.station_relocation_rehearsal_prob: 0.70
  commands.racket_target.station_relocation_abs_y_ranges:
    - [0.02, 0.06]
    - [0.04, 0.10]
    - [0.08, 0.16]
    - [0.14, 0.24]
    - [0.20, 0.30]
  commands.racket_target.station_relocation_arrival_radius: 0.05
  commands.racket_target.station_relocation_settle_max_lin_vel_by_level: [0.28, 0.24, 0.22, 0.20, 0.18]
  commands.racket_target.station_relocation_settle_max_ang_vel_by_level: [1.10, 0.90, 0.80, 0.70, 0.65]
  commands.racket_target.station_relocation_settle_min_steps_by_level: [4, 5, 6, 8, 10]
  commands.racket_target.station_relocation_hold_deadline_steps_by_level: [35, 45, 55, 70, 85]
  commands.racket_target.station_relocation_min_feet_contact: 0.50
  commands.racket_target.station_relocation_ema_rate: 0.05
  commands.racket_target.station_relocation_arrival_threshold: 0.70
  commands.racket_target.station_relocation_arrival_floor: 0.35
  commands.racket_target.station_relocation_settle_threshold: 0.45
  commands.racket_target.station_relocation_settle_floor: 0.15
  commands.racket_target.station_relocation_contact_threshold: 0.025
  commands.racket_target.station_relocation_contact_floor: 0.004
  commands.racket_target.station_relocation_safety_threshold: 0.97
  commands.racket_target.station_relocation_safety_floor: 0.92
  commands.racket_target.station_relocation_min_resolved_events: 4096
  commands.racket_target.station_relocation_required_advance_checks: 3
  commands.racket_target.station_relocation_required_regress_checks: 3
  commands.racket_target.table_workspace_level_source: station_relocation

  # Incoming speed is independent of route width. Planner perturbation is held
  # fixed and small, so neither curriculum silently changes command noise.
  commands.racket_target.one_bounce_speed_curriculum_enabled: true
  commands.racket_target.one_bounce_easy_horizontal_speed_range: [0.90, 1.40]
  commands.racket_target.one_bounce_full_horizontal_speed_range: [0.80, 2.20]
  commands.racket_target.one_bounce_easy_post_time_range: [0.38, 0.44]
  commands.racket_target.ability_curriculum_start_racket_pos_scale: [1.0, 1.0, 1.0]
  commands.racket_target.ability_curriculum_start_ball_scale: 0.45
  commands.racket_target.ability_curriculum_start_planner_perturb_scale: 1.0
  commands.racket_target.planner_perturb_curriculum_source: fixed
  commands.racket_target.planner_perturb_fixed_scale: 0.10
  commands.racket_target.ability_curriculum_advance_rate: 0.10
  commands.racket_target.ability_curriculum_regress_rate: 0.15
  commands.racket_target.ability_curriculum_min_resolved_events: 4096
  commands.racket_target.ability_curriculum_required_advance_checks: 2
  commands.racket_target.ability_curriculum_required_regress_checks: 2
  commands.racket_target.ability_curriculum_contact_threshold: 0.025
  commands.racket_target.ability_curriculum_net_threshold: 0.0
  commands.racket_target.ability_curriculum_success_threshold: 0.0
  commands.racket_target.ability_curriculum_recovery_threshold: 0.45
  commands.racket_target.ability_curriculum_recovery_floor: 0.30
  commands.racket_target.ability_curriculum_outcome_regress_ratio: 0.50
  commands.racket_target.ability_curriculum_require_side_contact: false
  commands.racket_target.ability_curriculum_use_cycle_success: false
  commands.racket_target.ability_curriculum_use_cycle_v2: false
  commands.racket_target.ability_curriculum_use_safety_gates: true
  commands.racket_target.ability_curriculum_use_targeted_attempt: true
  commands.racket_target.ability_curriculum_attempt_threshold: 0.05
  commands.racket_target.ability_curriculum_safety_threshold: 0.97
  commands.racket_target.ability_curriculum_safety_floor: 0.92
  commands.racket_target.ability_curriculum_station_saturation_threshold: 1.0
  commands.racket_target.ability_curriculum_station_saturation_regress_threshold: 1.1
  commands.racket_target.ability_curriculum_require_healthy_impact: true

  # A useful physical outcome opens a no-command recovery hold. The actual
  # contact/net/bounce tier is latched and settled after reusable READY.
  commands.racket_target.lifecycle_recovery_hold_gate_enabled: true
  commands.racket_target.cycle_v2_settlement_tier_mode: achieved
  commands.racket_target.cycle_v2_require_healthy_impact: true
  commands.racket_target.cycle_v2_required_consecutive_ready_steps: 5
  commands.racket_target.cycle_v2_visible_deadline_steps: 70
  commands.racket_target.cycle_v2_total_deadline_steps: 90
  commands.racket_target.cycle_v2_fail_unresolved_on_resample: true

  # Relocation receives directional potential plus one-shot arrival/settle
  # credit. Stable standing at the destination cannot farm the potential.
  rewards.prestrike_station_progress.weight: 1.2
  rewards.prestrike_station_progress.params:
    command_name: racket_target
    speed_scale: 0.25
    arrival_radius: 0.05
    stop_window_s: 0.20
    idle_cost: 0.01
    minimum_health_multiplier: 0.30
    final_minimum_health_multiplier: 0.10
    include_no_command_ready: true
  rewards.station_relocation_arrival_bonus.weight: 1.0
  rewards.station_relocation_settle_bonus.weight: 3.0

  # Failure remains visible but is deliberately smaller than the settled
  # outcome, preventing a scratch policy from learning to avoid all contact.
  rewards.cycle_v2_ready_fail.weight: -2.5
  rewards.cycle_v2_streak_bonus.params:
    command_name: racket_target
    min_streak: 2
    min_ability_level: 0.40
    start_step: 0
    warmup_steps: 0
    start_scale: 1.0


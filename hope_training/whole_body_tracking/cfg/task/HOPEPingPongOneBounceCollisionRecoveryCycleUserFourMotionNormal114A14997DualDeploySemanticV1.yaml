# =============================================================================
# A14997 dual deploy-semantics fine-tune.
#
# Starting point:
#   A long-horizon recovery checkpoint had strong oracle/no-gap MuJoCo hitting,
#   but failed under the real planner lifecycle with no-command gaps.
#
# Goal:
#   Preserve the A branch hit skill while training two deploy semantics directly:
#   1. no-command/deploy-ready observations must be stable;
#   2. after a useful hit, the carried state must be ready for the next strike.
# =============================================================================

defaults:
  - HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionNormal114LongHorizonRecoveryA
  - _self_

name: HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionNormal114A14997DualDeploySemanticV1

overrides:
  commands.motion.hold_steps_range: [70, 115]
  commands.motion.stand_start_prob: 0.15
  commands.motion.stand_start_min_hold: 70

  commands.racket_target.deploy_ready_hold_prob: 0.65
  commands.racket_target.deploy_ready_reach: [0.40, 0.20, -0.05]
  commands.racket_target.deploy_ready_velocity_w: [0.0, 0.0, 0.0]
  commands.racket_target.deploy_ready_normal_w: [1.0, 0.0, 0.0]
  commands.racket_target.deploy_ready_time_to_strike: 1.0

  rewards.no_command_ready_stability.weight: 0.75
  rewards.no_command_ready_stability.params:
    command_name: racket_target
    height_std: 0.09
    upright_std: 0.23
    lin_vel_std: 0.19
    ang_vel_std: 0.60
    station_std: 0.20
    racket_vel_std: 0.62
    arm_pos_std: 0.36
    arm_ori_std: 0.82
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 1500
    start_scale: 0.35

  rewards.next_prestrike_reachable.weight: 0.75
  rewards.next_prestrike_reachable.params:
    command_name: racket_target
    window_steps: 24
    reach_std: 0.31
    feasible_speed: 2.75
    feasible_speed_std: 0.50
    min_time_to_strike: 0.18
    max_time_to_strike: 1.20
    station_std: 0.25
    upright_std: 0.30
    start_step: 0
    warmup_steps: 2000
    start_scale: 0.30

  rewards.post_contact_recovery_ready.weight: 1.65

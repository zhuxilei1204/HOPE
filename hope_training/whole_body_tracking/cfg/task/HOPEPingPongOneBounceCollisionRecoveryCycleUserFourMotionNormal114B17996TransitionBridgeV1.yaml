# =============================================================================
# B17996/model_22494 transition-bridge fine-tune.
#
# Starting point:
#   model_22494 is the current stronger mainline, but ready-hold-only and
#   ready-hold+balance experiments showed that global hold exposure hurts
#   continuous contact, especially backhand.
#
# Goal:
#   Keep the 22494 hit distribution and normal 0.55 deploy-ready probability,
#   while making the post-hit -> next-prestrike transition explicit.
# =============================================================================

defaults:
  - HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionNormal114B17996ExplicitRecoveryV1
  - _self_

name: HOPEPingPongOneBounceCollisionRecoveryCycleUserFourMotionNormal114B17996TransitionBridgeV1

overrides:
  episode_length_s: 16.0

  # Preserve the validated deploy lifecycle distribution; do not repeat the 0.85 hold exposure.
  commands.motion.hold_steps_range: [80, 130]
  commands.motion.stand_start_prob: 0.20
  commands.motion.stand_start_min_hold: 80
  commands.racket_target.deploy_ready_hold_prob: 0.55

  # Small hit-pressure nudge only.  The main change is the transition bridge below.
  rewards.racket_position.weight: 4.55
  rewards.racket_velocity.weight: 2.45
  rewards.racket_velocity_projection.weight: 2.25
  rewards.impact_forward_lift.weight: 2.55
  rewards.impact_outgoing_velocity.weight: 4.70
  rewards.blade_direction.weight: 2.45
  rewards.soft_ball_contact.weight: 7.15
  rewards.ball_contact.weight: 3.05
  rewards.net_cross.weight: 3.90
  rewards.opponent_bounce.weight: 4.30

  rewards.no_command_ready_stability.weight: 0.92
  rewards.no_command_ready_stability.params:
    command_name: racket_target
    height_std: 0.09
    upright_std: 0.22
    lin_vel_std: 0.18
    ang_vel_std: 0.55
    station_std: 0.18
    racket_vel_std: 0.58
    arm_pos_std: 0.35
    arm_ori_std: 0.80
    arm_body_names:
      - right_shoulder_roll_Link
      - right_elbow_Link
      - right_wrist_yaw_Link
    start_step: 0
    warmup_steps: 1000
    start_scale: 0.50

  rewards.next_prestrike_reachable.weight: 0.82
  rewards.next_prestrike_reachable.params:
    command_name: racket_target
    window_steps: 24
    reach_std: 0.31
    feasible_speed: 2.75
    feasible_speed_std: 0.50
    min_time_to_strike: 0.18
    max_time_to_strike: 1.20
    station_std: 0.23
    upright_std: 0.28
    start_step: 0
    warmup_steps: 1500
    start_scale: 0.35


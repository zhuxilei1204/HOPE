hope_planner:
  ros__parameters:
    # --- Topics / frames ---
    poses_topic: "/poses"          # mocap ball stream (geometry_msgs/PoseArray)
    command_topic: "/racket/command"
    frame_id: "world"
    # Which slot in the /poses PoseArray is the ball (PoseArray carries no names;
    # publish the ball first, or set this to its index). Confirm against your
    # live stream, e.g. `ros2 topic echo /poses --once`.
    ball_pose_index: 0

    # --- Strike plane ---
    # Fixed virtual hitting-plane x (m). Set to your robot placement + reach so
    # the incoming ball crosses this plane in front of the robot. Example only.
    x_hit: 0.20

    # --- Forehand / backhand selection ---
    # The side is chosen once per incoming ball by splitting the predicted
    # lateral (y) crossing at swing_side_split_y: y below the split -> FOREHAND,
    # at/above -> BACKHAND. Default splits at the table centreline; tune to your
    # robot's lateral position and reach.
    swing_side_split_y: -0.7625
    # Optional small hysteresis band (m) around the split so a ball arriving near
    # the boundary does not flip the side between consecutive rallies. 0 disables.
    swing_side_hysteresis_y: 0.04

    # --- Fixed landing target (opponent half) ---
    target_land_x: 2.055           # opponent half-centre x (= table length * 3/4)
    target_land_y: -0.7625         # opponent half-centre y (= -table width / 2)
    # Desired post-strike flight time (s). Shapes the demanded racket speed; tune
    # to your policy's reachable racket-velocity envelope.
    delta_t_flight: 0.5

    # --- Solve / prediction ---
    # Every mocap sample feeds the estimator; the predict+plan solve runs at most
    # every solve_period_s (<= 50 Hz). 0.0 solves on every sample.
    solve_period_s: 0.02
    tracking_gap_reset_s: 0.25
    max_predict_time: 2.0          # forward prediction horizon (s)
    dt_integrate: 0.005            # 5 ms: <1 ms strike-time error, ~5x faster on HDU
    # Velocity-fit window IN SAMPLES. Real 360 Hz Motive captures from
    # /mnt/ssd/zxl/拍1动捕数据.zip and 拍2动捕数据.zip validated best at 67
    # samples for 50-500 ms ahead prediction.
    fit_window: 67
    # Real-robot replay gate (session 20260726_142055_389966836): 20 samples
    # preserves 18/19 credible tasks while suppressing low-confidence startup.
    # Fixed-population replay (147 trajectories / 151 crossings, 2026-07-28):
    # 12 samples covered 40.4% of crossings with 48.2 mm median error at
    # 0-50 ms, while 20 samples covered only 11.9%. Six samples covered more
    # events but increased startup-velocity risk, so 12 is the deployed tradeoff.
    min_ready_samples: 12
    revision_gate_initial_consecutive: 2
    revision_gate_initial_position_tolerance_m: 0.10
    revision_gate_max_position_jump_m: 0.10
    revision_gate_max_velocity_jump_mps: 1.50
    revision_gate_freeze_tts_s: 0.20
    revision_gate_max_strike_time_jump_s: 0.040
    # Bounce detection for centre-tracked balls. The 40 mm ball centre is near
    # z=0.02 m at contact; real captures had enough noise/curvature that 0.11 m
    # caught table bounces more consistently than the older 0.05 m threshold.
    bounce_center_z_max: 0.11
    # A three-frame local minimum alone is too sensitive to mocap jitter. At
    # 360 Hz, require at least 2 mm of descent and rebound, reject triplets
    # spanning a dropped-frame gap, and allow at most one impact per 80 ms.
    bounce_min_vertical_delta: 0.002
    bounce_refractory_s: 0.08
    bounce_max_sample_gap_s: 0.01

    # --- Table placement ---
    # Table's +y edge in the play frame (table occupies y in [y_max - width, y_max]).
    table_y_max: 0.0

    # --- Ball physics ---
    # No-spin gravity / geometry are read from configs/ball_physics.yaml. Leave
    # empty to auto-discover it by walking up from the package, or set an
    # explicit path.
    ball_physics_path: ""
    # Planner-only overrides fitted against the 2026-07-21 Motive trajectories.
    # These do not modify the shared ball_physics.yaml used by training.
    drag_k: 0.18
    table_c_h: 0.80
    table_c_v: 0.95
